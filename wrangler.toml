# Cloudflare Workers configuration for the Track2Mix marketing site.
#
# The Cloudflare project is a Workers service — Workers Builds runs
# `wrangler deploy` — so the site ships as Workers Static Assets rather than as
# a Pages project: site/ is uploaded to the edge and worker/index.js sits in
# front of it, routing /api/contact to worker/contact.js and passing everything
# else through to the asset server.
#
# Setup is documented in docs/DEPLOY.md, contacts in docs/CONTACTS.md.

name = "track2mix"
main = "worker/index.js"
# Deliberately behind today's date. Cloudflare rejects a compatibility_date
# newer than the runtime it deploys to, and `wrangler deploy --dry-run` does not
# check this — a date in 2027 passes a dry-run unchanged — so a date set to
# "today" can only fail in the real build. Bump this on purpose, after reading
# what changes: https://developers.cloudflare.com/workers/configuration/compatibility-dates/
compatibility_date = "2025-09-30"

# Worker Custom Domains: Cloudflare creates the DNS records and certificates on
# deploy. These hostnames used to be custom domains of the old Pages project of
# the same name; the move is documented in docs/DEPLOY.md.
routes = [
  { pattern = "track2mix.com", custom_domain = true },
  { pattern = "downloads.track2mix.com", custom_domain = true },
]
# Declaring routes makes wrangler disable the workers.dev URL by default. Keep
# it: docs/DEPLOY.md uses it to check a deploy independently of DNS.
workers_dev = true

[assets]
# The static site, exactly as it sits in the repository. No build step: the
# landing page is hand-written HTML, CSS and one JS file.
directory = "site"
binding = "ASSETS"
# Every request reaches the Worker first so it can route /api/contact and set
# response headers in one place. site/_headers used to do the header half of
# that; it was a Pages convention, and worker/index.js does it in code now,
# where worker/index.test.mjs can check it.
run_worker_first = true

[observability]
# Worker logs are how a failed contact capture gets diagnosed. contact.js
# console.errors the specific cause; without this they go nowhere.
enabled = true

# Central contacts database, shared by every app.
#
# Created with `wrangler d1 create contacts`; the schema is applied with
# `wrangler d1 execute contacts --remote --file=./migrations/0001_contacts.sql`.
# Cloudflare validates database_id as a UUID, so never put a placeholder here:
# it fails the whole deploy, including the static site.
# Full walkthrough in docs/CONTACTS.md.
[[d1_databases]]
binding = "CONTACTS_DB"
database_name = "contacts"
database_id = "dfd0eb85-430c-4f06-95b3-9468d94a00f9"

[vars]
# Which app a contact_events row is attributed to. Every app writing to the
# shared database sets its own value here.
APP_NAME = "track2mix"
# Where the download link points. Returned by the API after a successful
# capture, so it is not present in the page source beforehand.
DOWNLOAD_URL = "https://downloads.track2mix.com"

# Secrets are NOT set here — they would end up in git. Set them with:
#   wrangler secret put LIST_ENDPOINT
#   wrangler secret put LIST_AUTH_HEADER
