name: Mobile

# Builds the tablet apps. Android runs on every v* tag and on demand; it is
# signed when the ANDROID_KEYSTORE_* secrets exist and unsigned otherwise, and
# the .aab/.apk are always uploaded as workflow artifacts. iPad runs on a macOS
# runner only when the Apple signing secrets exist, because `tauri ios build`
# cannot produce an .ipa without them. Neither job uploads to a store; that is
# a manual step documented in docs/MOBILE.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  android:
    name: Android (tablet, .aab + .apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          key: android

      - run: bun install --frozen-lockfile

      - name: Write keystore.properties
        # Absent secrets → the step is skipped and Gradle logs that the build
        # is unsigned (see app/build.gradle.kts). Nothing fails silently.
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: bunx tauri android build --apk --aab --target aarch64 --target armv7 --target x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: track2mix-android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  ipad:
    name: iPad (.ipa for App Store Connect)
    runs-on: macos-latest
    # The job needs a distribution certificate and provisioning profile to do
    # anything useful; without them it is skipped rather than failing the tag.
    if: ${{ vars.IOS_BUILD_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          key: ios

      - run: bun install --frozen-lockfile

      - name: Install the distribution certificate and provisioning profile
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/track2mix.mobileprovision

      - name: Generate the Xcode project
        # src-tauri/gen/apple is committed once it exists; until then init
        # creates it here so the first .ipa can be produced from CI.
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            bunx tauri ios init
          fi

      - name: Build and export for App Store Connect
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$APPLE_API_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          bunx tauri ios build --export-method app-store-connect

      - uses: actions/upload-artifact@v4
        with:
          name: track2mix-ipad
          if-no-files-found: error
          path: src-tauri/gen/apple/build/**/*.ipa
