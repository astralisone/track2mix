[package]
name = "track2mix-tauri"
version = "0.2.0"
edition = "2021"

[lib]
name = "track2mix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Opens the files the dialog hands back on iPadOS and Android (content:// URIs,
# security-scoped copies), which std::fs cannot. Used from Rust only.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
urlencoding = "2"

track2mix = { path = ".." }
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = "0.5"
# MP3 export; compiles LAME from source, no system libmp3lame needed.
mp3lame-encoder = "0.2.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
